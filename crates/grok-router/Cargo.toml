[package]
name = "grok-router"
version = "0.1.0"
edition = "2024"
description = "grok-router command line"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
serde_json = "1"
toml = "1.1.8"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
